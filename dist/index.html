<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampus Impian</title>
<style>
:root { --bg: #f7f4ec; --ink: #23272e; --dim: #6b7079; --line: #ddd6c6; --accent: #1f6f5c; --ok: #2b8a3e; --bad: #c92a2a; --wait: #b8650b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); }
#app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; height: 100%; }
#hud { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding: 8px 14px; background: #20302b; color: #eef2ee; }
#hud b { font-variant-numeric: tabular-nums; }
.speed { margin-left: auto; display: flex; gap: 4px; }
.speed button { background: #33463f; color: #eef2ee; border: 1px solid transparent; padding: 4px 10px; min-width: 40px; }
.speed button.on { border-color: #f2c94c; }
#view { position: relative; min-height: 0; }
#cam { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
#cam button { width: 40px; height: 40px; background: #fffdf8; border: 1px solid var(--line); font-size: 18px; }
#side { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }
#tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
#tabs:empty { display: none; }
#tabs button { background: none; border: 1px solid transparent; padding: 5px 9px; }
#tabs button.on { background: #fff; border-color: var(--line); font-weight: 600; }
#body { flex: 1; overflow-y: auto; padding: 12px 14px 24px; }
h2 { font-size: 18px; margin: 0 0 4px; } h3 { font-size: 14px; margin: 16px 0 6px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 6px 12px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #1971c2; outline-offset: 2px; }
.dim { color: var(--dim); } .ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--wait); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row button { flex-shrink: 0; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 10px 0; cursor: pointer; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card h3 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.badge { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 13px; }
.b0 { background: #d9480f; } .b1 { background: #1971c2; } .b2 { background: #2b8a3e; }
dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 8px 0; }
dt { color: var(--dim); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
label { display: block; margin-top: 10px; }
label.chk { display: flex; gap: 8px; align-items: flex-start; }
select, input[type=range] { width: 100%; margin-top: 4px; }
select { font: inherit; padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
output { display: block; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: #e8e2d4; border-radius: 4px; overflow: hidden; margin-top: 3px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.warn i { background: var(--bad); }
.next { background: #fff; border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 4px; }
.spark { width: 100%; height: 60px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.btns { display: flex; gap: 8px; margin-top: 14px; }
#body p.good, #body p.bad, #body p.info { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
#toasts { position: fixed; left: 12px; top: 56px; display: flex; flex-direction: column; gap: 6px; max-width: 360px; pointer-events: none; }
.toast { background: #fffdf8; border-left: 4px solid #868e96; padding: 8px 12px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.toast.good { border-color: var(--ok); } .toast.bad { border-color: var(--bad); }
#intro { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,30,27,.55); z-index: 10; }
#intro div { background: var(--bg); max-width: 480px; padding: 24px; border-radius: 10px; margin: 16px; }
@media (max-width: 800px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 46vh; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  .speed { margin-left: 0; }
  #toasts { max-width: calc(100vw - 24px); }
}
</style>
  <script type="module" crossorigin src="/assets/index-F05M0uEQ.js"></script>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="view">
    <div id="cam">
      <button data-act="rot" data-arg="-1" aria-label="Putar kiri">⟲</button>
      <button data-act="rot" data-arg="1" aria-label="Putar kanan">⟳</button>
      <button data-act="zoom" data-arg="0.8" aria-label="Perbesar">+</button>
      <button data-act="zoom" data-arg="1.25" aria-label="Perkecil">−</button>
    </div>
  </main>
  <aside id="side"><nav id="tabs"></nav><section id="body"></section></aside>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="intro"><div>
  <h2>Kampus Impian</h2>
  <p>Kota di sekitarmu hidup dan tumbuh sendiri. Tugasmu sebagai ketua yayasan: pilih lahan, urus izin, bangun gedung, tetapkan aturan, rekrut dosen, dan jalankan tridarma sampai kampusmu terakreditasi Unggul.</p>
  <p class="dim">Seret peta untuk menggeser, scroll atau cubit untuk zoom, Q/E untuk memutar.</p>
  <button class="primary" data-act="start">Mulai</button>
</div></div>
</body>
</html>
